name: Stage tested release assets

on:
  workflow_dispatch:
    inputs:
      installer_run_id:
        description: Successful Windows installer workflow run ID
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
        default: v0.2.0

permissions:
  contents: write
  actions: read

concurrency:
  group: release-assets-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out upload tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Verify tested installer and stage draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_RUN_ID: ${{ inputs.installer_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/publish-release-assets.mjs
