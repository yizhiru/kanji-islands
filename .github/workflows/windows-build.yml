name: Windows installer
run-name: Windows x64 · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    # Draft release assets are only visible to identities with push access.
    # The token is only passed to the resource download step, never to packaging.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Check resource configuration
        env:
          DATA_ASSET: ${{ vars.WINDOWS_BUILD_DATA_ASSET_ID }}
          DATA_HASH: ${{ vars.WINDOWS_BUILD_DATA_SHA256 }}
          DATA_KEY: ${{ secrets.WINDOWS_BUILD_DATA_KEY }}
        run: |
          if (-not $env:DATA_ASSET -or -not $env:DATA_HASH -or -not $env:DATA_KEY) {
            throw 'Run cloud-build-data.mjs prepare and upload on your Mac first.'
          }

      - name: Download encrypted build resources
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_BUILD_DATA_ASSET_ID: ${{ vars.WINDOWS_BUILD_DATA_ASSET_ID }}
        run: node scripts/cloud-build-data.mjs download "$env:RUNNER_TEMP/build-data.enc"

      - name: Verify and restore build resources
        env:
          WINDOWS_BUILD_DATA_KEY: ${{ secrets.WINDOWS_BUILD_DATA_KEY }}
          WINDOWS_BUILD_DATA_SHA256: ${{ vars.WINDOWS_BUILD_DATA_SHA256 }}
        run: node scripts/cloud-build-data.mjs restore "$env:RUNNER_TEMP/build-data.enc"

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund --fetch-timeout=60000

      - name: Check resource packaging tools
        run: node --test tests/cloud-build-data.test.mjs

      - name: Type check and test
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install vitest run

      # The Mac already generated the dictionary snapshot. npm run build/test
      # would rebuild it and require the raw upstream dictionaries and Python.
      - name: Build frontend
        run: npx --no-install vite build

      - name: Package Windows x64 installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win nsis --x64 --publish never

      - name: Verify packaged data
        run: node scripts/verify-packaged-resources.mjs release/win-unpacked/resources/app.asar

      - name: Launch packaged Windows app
        timeout-minutes: 5
        env:
          KANJI_PACKAGED_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\汉字岛.exe
        run: npm run test:desktop

      - name: Write installer checksums
        run: |
          $installers = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No Windows installer was generated.' }
          $checksums = $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding utf8
          "Windows x64 installer built from commit $env:GITHUB_SHA. Download the workflow artifact below." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kanji-islands-windows-x64-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build-diagnostics-${{ github.run_number }}
          path: |
            release/builder-debug.yml
            output/app/*.png
            output/app/*.json
          if-no-files-found: ignore
          retention-days: 7
